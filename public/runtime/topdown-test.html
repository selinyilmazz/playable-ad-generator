<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Top-Down Runtime — Manual Test Harness</title>
<!--
  Bu sayfa Generator UI'ının (public/index.html) BİR PARÇASI DEĞİL — hiçbir
  yerden link verilmiyor, sadece Top-Down Runtime'ı elle hazırlanmış bir
  Game Specification ile izole şekilde çalıştırıp gözle/otomatik test etmek
  için bağımsız bir geliştirici sayfası. express.static zaten public/
  klasörünü tamamen serve ettiği için (server/index.js) bu sayfaya erişmek
  için hiçbir yeni route/sunucu değişikliği GEREKMEDİ.
-->
<link rel="stylesheet" href="topdown/style.css" />
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #05060a;
  }
  #stage {
    width: 100%;
    height: 100vh;
  }
  #debug-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.65);
    color: #7CFC00;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    padding: 6px 10px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="debug-bar">Top-Down Runtime test harness — WASD / Arrow Keys to move. Spec: forest / survive 30s.</div>

  <div id="stage" class="td-game-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <script src="topdown/utils.js"></script>
  <script src="topdown/collision.js"></script>
  <script src="topdown/specSchema.js"></script>
  <script src="topdown/inputManager.js"></script>
  <script src="topdown/camera.js"></script>
  <script src="topdown/entity.js"></script>
  <script src="topdown/player.js"></script>
  <script src="topdown/enemy.js"></script>
  <script src="topdown/animation.js"></script>
  <script src="topdown/particles.js"></script>
  <script src="topdown/gameState.js"></script>
  <script src="topdown/renderer.js"></script>
  <script src="topdown/hud.js"></script>
  <script src="topdown/gameLoop.js"></script>
  <script src="topdown/collectibles.js"></script>
  <script src="topdown/obstacles.js"></script>
  <script src="topdown/assets.js"></script>
  <script src="topdown/runtime.js"></script>
  <script>
    // Elle hazırlanmış örnek Game Specification — Selin'in verdiği örnekle
    // BİREBİR aynı (hiçbir alan eklenmedi/değiştirilmedi).
    // COLLECTIBLES+OBSTACLES round — collectibles/obstacles additive olarak
    // eklendi (merkez-nokta konvansiyonu, bkz. specSchema.js). Diğer TÜM
    // alanlar (player/enemies/world/goal/theme) HİÇ değişmedi.
    var EXAMPLE_SPEC = {
      gameType: "topDown",
      theme: "forest",
      player: { speed: 220, health: 3 },
      enemies: { count: 5, speed: 80 },
      world: { width: 2400, height: 1600 },
      goal: { type: "survive", duration: 30 },
      collectibles: [
        { x: 700, y: 700 },
        { x: 1200, y: 500 },
        { x: 1800, y: 1100 },
        { x: 500, y: 1300 },
        { x: 2000, y: 300 },
      ],
      obstacles: [
        // NOT: player her zaman dünya MERKEZİNDE (1200,800) doğar (bkz.
        // runtime.js resetEntities — bilinçli/kabul edilmiş sınırlama:
        // player spawn'ı için obstacle-kaçınma YOK) — bu yüzden hiçbir
        // obstacle BİLEREK tam o noktaya konulmadı.
        { x: 1500, y: 900, width: 160, height: 60 },
        { x: 900, y: 1100 },
        { x: 1700, y: 600 },
      ],
      // ASSET LIBRARY round — server/services/topdown/assetResolver.js'in
      // theme:"forest" için ÜRETTİĞİYLE BİREBİR AYNI URL'ler (elle, bu
      // bağımsız test sayfası server'a hiç gitmediği için). Gerçek uçtan uca
      // (prompt -> /api/generate -> resolver) doğrulama server/tests/
      // topDownIntegration.test.js'te ayrıca yapılıyor.
      assets: {
        player: "/assets/packs/sunnyland-forest/characters/player.png",
        enemy: "/assets/packs/sunnyland-forest/enemies/bee.png",
        collectible: "/assets/packs/sunnyland-forest/objects/carrot.png",
        obstacle: "/assets/packs/sunnyland-forest/objects/rock.png",
        background: "/assets/packs/sunnyland-forest/backgrounds/forest.png",
      },
    };

    var canvas = document.getElementById("game-canvas");
    var game = window.TopDownRuntime.create(canvas, EXAMPLE_SPEC);
    game.start();

    // Manuel/otomatik (Playwright) test erişimi için global referans —
    // sadece bu test sayfasına özel, runtime'ın kendi public API'sinin
    // parçası değil.
    window.__topDownGame = game;
  </script>
</body>
</html>
